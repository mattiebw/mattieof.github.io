<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Thanks to: https://css-tricks.com/emoji-as-a-favicon/ -->
        <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👨‍💻</text></svg>">

        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
        <link href="main.css" rel="stylesheet">
        <link rel="stylesheet" href="http://github.hubspot.com/odometer/themes/odometer-theme-default.css" />
        <script src="http://github.hubspot.com/odometer/odometer.js"></script>

        <title>Matt Ware</title>
    </head>
    <body>
        <main class="card">
            <h1>Matt Ware</h1>
            <p>Hey! I'm rebuilding my website at the moment.</p>
            <p>In the meantime, you can find me here:</p>
            <nav class="links">
                <a href="https://github.com/mattiebw">GitHub</a>
                <a href="https://www.linkedin.com/in/mattbware/">LinkedIn</a>
                <a href="https://cal.com/mattware">Call Me</a>
                <a id="email-link" href="mailto:imnotreal@mattwa.re">Email</a>
            </nav>
            <noscript>
                <p>I'm on UK time.</p>
            </noscript>
            <p class="js-content" hidden>The time for me right now is <b style="white-space: nowrap;">
                <span class="digit">1</span>
                <span class="digit">9</span>
                <span>:</span>
                <span class="digit">2</span>
                <span class="digit">0</span>
                <span>:</span>
                <span class="digit">3</span>
                <span class="digit">0</span>
            </b></p>
        </main>
    </body>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Enable any JS only content once the page has loaded.
            const jsContent = document.querySelectorAll('.js-content');
            for (const content of jsContent) {
                content.removeAttribute('hidden');
            }
        });

        // Display the current time in the UK.
        const digits = document.querySelectorAll(".digit");
        const time = new Date().toLocaleTimeString('en-GB', {
                timeZone: 'Europe/London',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
        }).replace(/:/g, '');
        digits.forEach((digit, index) => {
            const od = new Odometer({
                el: digit,
                duration: 500,
                value: time[index],
            })
        });

        function updateTime() 
        {
            const time = new Date().toLocaleTimeString('en-GB', {
                timeZone: 'Europe/London',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            }).replace(/:/g, '');

            digits.forEach((digit, index) => {
                const old = digit.textContent;
                const newText = time[index];
                if (old !== newText) {
                    digit.textContent = newText;
                }
            });
        }

        updateTime();
        setInterval(updateTime, 1000);

        const parts = ["hello", "@", "ma", "ttwa", ".", "re"];
        const emailLink = document.getElementById("email-link");
        emailLink.href = "mailto:" + parts.join("");
    </script>
</html>
